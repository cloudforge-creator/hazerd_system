{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Users</h2>
  <table>
    <thead><tr><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead>
    <tbody>
    {% for u in users %}
    <tr>
      <td>{{ u.username }}{% if u.username|lower == me|lower %} (you){% endif %}</td><td>{{ u.role }}</td><td>{{ 'DISABLED' if u.disabled else 'active' }}</td>
      <td>
        <form method="post" action="{{ url_for('users_action', username=u.username, action='enable' if u.disabled else 'disable') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">{{ 'Enable' if u.disabled else 'Disable' }}</button></form>
        <form method="post" action="{{ url_for('users_action', username=u.username, action='role') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <select name="role">{% for r in roles %}<option value="{{ r }}" {% if r == u.role %}selected{% endif %}>{{ r }}</option>{% endfor %}</select>
          <button type="submit">Change role</button></form>
        <form method="post" action="{{ url_for('users_action', username=u.username, action='password') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <input type="password" name="password" placeholder="new password (8+ chars)" autocomplete="new-password">
          <button type="submit">Set password</button></form>
      </td>
    </tr>
    {% endfor %}
    </tbody>
  </table>
</section>
<section class="card narrow2">
  <h2>Add a user</h2>
  <form method="post" action="{{ url_for('users_add') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" required autocomplete="off"></label>
    <label>Password <input type="password" name="password" required autocomplete="new-password"></label>
    <label>Role <select name="role">{% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}</select></label>
    <button type="submit">Create user</button>
  </form>
</section>
{% endblock %}
